  <script>
  (() => {
    'use strict';
    const $=id=>document.getElementById(id);
    const viewport=$('orbit-viewport'),map=$('star-map');
    let scale=1,panX=0,panY=0,dragging=false,suppressClick=false,dragStart=null;
    function renderMap(){map.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;$('zoom-in').disabled=scale>=1.7;$('zoom-out').disabled=scale<=.7;}
    function setZoom(value){scale=Math.min(1.7,Math.max(.7,value));renderMap();}
    function resetMap(){scale=1;panX=0;panY=0;renderMap();}
    $('zoom-in').addEventListener('click',()=>setZoom(scale+.15));
    $('zoom-out').addEventListener('click',()=>setZoom(scale-.15));
    $('reset-view').addEventListener('click',resetMap);
    viewport.addEventListener('pointerdown',event=>{
      if(event.button!==0||!event.isPrimary)return;
      dragStart={x:event.clientX,y:event.clientY,panX,panY,pointerId:event.pointerId};
    });
    viewport.addEventListener('pointermove',event=>{
      if(!dragStart||dragStart.pointerId!==event.pointerId)return;
      const dx=event.clientX-dragStart.x,dy=event.clientY-dragStart.y;
      if(!dragging&&Math.hypot(dx,dy)>6){dragging=true;suppressClick=true;viewport.classList.add('dragging');viewport.setPointerCapture(event.pointerId);}
      if(dragging){panX=Math.max(-viewport.clientWidth*.65,Math.min(viewport.clientWidth*.65,dragStart.panX+dx));panY=Math.max(-viewport.clientHeight*.5,Math.min(viewport.clientHeight*.5,dragStart.panY+dy));renderMap();}
    });
    function endPointer(event){if(dragStart?.pointerId===event.pointerId){dragStart=null;dragging=false;viewport.classList.remove('dragging');setTimeout(()=>{suppressClick=false;},0);}}
    window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',endPointer);viewport.addEventListener('lostpointercapture',endPointer);
    viewport.addEventListener('click',event=>{if(suppressClick){event.preventDefault();event.stopPropagation();}},true);
    viewport.addEventListener('wheel',event=>{if(!event.ctrlKey)return;event.preventDefault();setZoom(scale-event.deltaY*.002);},{passive:false});
    const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
    let motionPaused=reducedMotion.matches;
    function updateMotionButton(){const button=$('motion-toggle');$('universe').classList.toggle('still',motionPaused);button.setAttribute('aria-label',motionPaused?'움직임 켜기':'움직임 끄기');button.setAttribute('aria-pressed',String(motionPaused));button.classList.toggle('is-paused',motionPaused);}
    $('motion-toggle').addEventListener('click',()=>{motionPaused=!motionPaused;updateMotionButton();if(!motionPaused)startAnimation();else{cancelAnimationFrame(frame);frame=null;drawStars(lastTime);}});
    reducedMotion.addEventListener('change',event=>{motionPaused=event.matches;updateMotionButton();if(!motionPaused)startAnimation();else{cancelAnimationFrame(frame);frame=null;drawStars(lastTime);}});
    const canvas=$('starfield'),ctx=canvas.getContext('2d');
    let width=0,height=0,stars=[],sparkles=[],frame=null,lastTime=0,lastDraw=0;
    function seedRandom(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};}
    function resize(){
      const rect=$('universe').getBoundingClientRect();width=rect.width;height=rect.height;
      const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx?.setTransform(dpr,0,0,dpr,0,0);
      const random=seedRandom(20261007);stars=Array.from({length:Math.min(260,Math.floor(width*height/4800))},()=>({x:random()*width,y:random()*height,r:random()*1.1+.4,a:random()*.5+.2,phase:random()*Math.PI*2,speed:random()*.4+.2}));sparkles=Array.from({length:16},(_,i)=>({x:random(),y:random()*.9+.05,s:random()*5+4,phase:random()*Math.PI*2,speed:random()*.6+.4,color:['#ffd34d','#fff4dc','#ff8fb1','#8fd3f0'][i%4]}));
      drawStars(lastTime);
    }
    function sparkle(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill();}
    function drawStars(time){
      if(!ctx)return;ctx.clearRect(0,0,width,height);
      stars.forEach(star=>{const flicker=motionPaused?1:.7+Math.sin(time*.0003*star.speed+star.phase)*.3;ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,244,220,${star.a*flicker})`;ctx.fill();});
      sparkles.forEach(sp=>{const pulse=motionPaused?1:.75+Math.sin(time*.0012*sp.speed+sp.phase)*.25;ctx.fillStyle=sp.color;sparkle(sp.x*width,sp.y*height,sp.s*pulse);});
    }
    function tick(time){frame=null;if(document.hidden||motionPaused)return;if(time-lastDraw>40){lastTime=time;lastDraw=time;drawStars(time);}frame=requestAnimationFrame(tick);}
    function startAnimation(){if(frame===null&&!document.hidden&&!motionPaused)frame=requestAnimationFrame(tick);}
    document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=null;}else startAnimation();});
    const observer=new ResizeObserver(resize);observer.observe($('universe'));
    window.addEventListener('resize',()=>{if(scale!==1||panX||panY)resetMap();});
    updateMotionButton();resize();startAnimation();
  })();
  </script>
