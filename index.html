  <style>
    :root{color-scheme:dark;--bg:#080b16;--ink:#f0eff7;--accent:#c5b8ff;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:8px}svg{display:block}::selection{background:#a99ae944}
    .site-header{height:90px;padding:0 4.5%;position:absolute;inset:0 0 auto;z-index:3;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{margin:0;display:flex;gap:13px;align-items:center;letter-spacing:.09em;font-size:14px;font-weight:500}.brand svg{width:34px;height:34px;color:#ded5ff}.header-links{display:flex;align-items:center;gap:18px;pointer-events:auto}.about-link{display:flex;align-items:center;min-height:44px;font-size:13px;color:#b5b3c5}.about-link:hover{color:#fff}.github-link{display:grid;place-items:center;width:44px;height:44px;color:#a5a4b6;pointer-events:auto;border-radius:50%}.github-link:hover{color:#fff;background:#ffffff09}.github-link svg{width:22px;height:22px}
    .universe{height:100svh;min-height:650px;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 60% 44%,#29203d66,transparent 48%),radial-gradient(ellipse at 43% 85%,#101c3c88,transparent 45%),#080b16}.universe:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(0deg,#080b16bb,transparent 18%)}#starfield{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.orbit-viewport{position:absolute;inset:90px 0 90px;overflow:hidden;touch-action:pan-y pinch-zoom;cursor:grab;z-index:1}.orbit-viewport.dragging{cursor:grabbing}.star-map{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}.orbit-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.orbit-lines ellipse,.orbit-lines path{fill:none;stroke:#a5a0d120;stroke-width:1;vector-effect:non-scaling-stroke}.orbit-lines .minor{stroke:#a5a0d110;stroke-dasharray:3 9}.orbit-lines .route{stroke:#c9b1f42b;stroke-dasharray:2 8}.orbit-lines circle{fill:#beb3dd66}
.planet-node{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);transform:translate(-50%,-50%);padding:0;background:transparent;border-radius:50%;outline-offset:15px;transition:opacity .25s;z-index:2}.planet-node:before{content:"";position:absolute;inset:-20px;border-radius:50%;border:1px solid transparent;transition:border-color .3s,transform .4s}.planet-node:hover:before,.planet-node:focus-visible:before{border-color:#cbb4ff55;transform:scale(1.02)}.planet{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;box-shadow:inset -18px -12px 30px #0009,0 0 48px var(--halo,#a885ff1a);transition:transform .5s,box-shadow .5s;isolation:isolate;overflow:hidden}.planet-node:hover .planet,.planet-node:focus-visible .planet{transform:scale(1.06)}.planet:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 1px 2px 4px #ffffff4d,inset -8px -6px 20px #0008;pointer-events:none}.planet-node .planet-label{position:absolute;top:calc(100% + 22px);left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}.planet-label strong{display:block;font-size:15px;line-height:1.4;font-weight:550;letter-spacing:-.02em}.p-onetext{background:radial-gradient(circle at 30% 22%,#daf1f4 0,#8dc6d0 12%,#5b8aa4 36%,#384b6b 61%,#151c37 88%);--halo:#89bee333}.p-onetext:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(-20deg,transparent 0 12px,#adcadd16 14px 20px,transparent 23px 35px);transform:rotate(-20deg)}.planet-type{font:500 64px Georgia,serif;letter-spacing:-.08em;color:#f1ffffc7;transform:rotate(-12deg);text-shadow:0 2px 20px #2e5b94;z-index:1}.p-trolley{background:radial-gradient(circle at 30% 25%,#f9e4bb,#b99975 42%,#785763 70%,#2b223c);--halo:#f3c48c20}.p-trolley img{width:86%;height:86%;object-fit:cover;border-radius:50%;opacity:.87;mix-blend-mode:luminosity;transform:rotate(-13deg);filter:contrast(1.12)}.p-dock{background:radial-gradient(circle at 28% 25%,#cfc2f5,#8774b9 35%,#463d70 66%,#1b1938);--halo:#b4a4ff22}.planet-ring{position:absolute;width:180%;height:47%;left:-40%;top:25%;border:7px solid #9a8bc93b;border-top-color:#d5c5fa88;border-left-color:#bba4ec77;border-radius:50%;transform:rotate(-30deg);pointer-events:none;z-index:3}.p-stars{background:radial-gradient(circle at 28% 25%,#fff7cf,#e0bd70 38%,#926d43 65%,#372c2b);--halo:#ffd48322}.p-copy{background:radial-gradient(circle at 28% 25%,#e1e2ed,#8f9baf 38%,#4c576e 65%,#202537)}.p-shader{background:radial-gradient(circle at 28% 25%,#ffa6bb,#b16b97 36%,#64385d 65%,#2d2038);--halo:#e792c020}.p-slime{background:radial-gradient(circle at 28% 25%,#d8f0ba,#88aa77 38%,#4b6a5a 65%,#1c3334);--halo:#92ba7422}.p-lab{background:radial-gradient(circle at 28% 25%,#bbcfff,#718dc0 38%,#394a78 65%,#1b233d)}.mini-symbol{font:500 22px var(--mono);color:#ffffffb3;text-shadow:1px 2px 5px #0007}

    .planet-node{user-select:none;-webkit-user-drag:none;min-width:44px;min-height:44px;display:block}.planet-node:before{inset:-18px}.planet-node:hover,.planet-node:focus-visible{z-index:4}.planet-label{color:#c9c8d8}.planet-node:hover .planet-label,.planet-node:focus-visible .planet-label{color:#fff}.planet-label strong{font-size:14px;font-weight:450;letter-spacing:.01em}.planet-type{font-size:68px}.map-controls{position:absolute;right:4.5%;bottom:28px;z-index:4;display:flex;gap:7px}.map-controls button{border:1px solid #ffffff16;border-radius:50%;background:#1014229c;color:#a9a8bd;width:44px;height:44px;display:grid;place-items:center;font-size:22px}.map-controls button:hover{background:#25233b;color:white}.map-controls button:disabled{opacity:.3;cursor:default}.map-controls svg{width:17px;height:17px}.map-controls .motion-toggle{margin-right:13px}.motion-toggle .play{display:none}.motion-toggle.is-paused .play{display:block}.motion-toggle.is-paused .pause{display:none}.noscript{position:absolute;bottom:30px;left:5%;font-size:12px;color:#a9a8bd}
    @media(max-width:760px){.site-header{height:76px;padding:0 6%}.brand{font-size:12px;gap:10px}.brand svg{width:29px;height:29px}.universe{min-height:740px}.orbit-viewport{inset:105px 0 115px}.planet-node{left:var(--mx);top:var(--my);width:max(44px,calc(var(--size)*.65));height:max(44px,calc(var(--size)*.65))}.planet-type{font-size:44px}.planet-ring{border-width:4px}.planet-node .planet-label{top:calc(100% + 18px)}.planet-label strong{font-size:12px}.mini-symbol{font-size:17px}.map-controls{right:6%;bottom:26px}.orbit-lines{opacity:.6}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>

<body>

    <div class="map-controls" role="group" aria-label="지도 보기 조절">
      <button class="motion-toggle" id="motion-toggle" aria-label="별빛 움직임 끄기" aria-pressed="false"><svg class="pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10m6-10v10" stroke="currentColor" stroke-width="2"/></svg><svg class="play" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6Z" fill="currentColor"/></svg></button>
      <button id="zoom-out" aria-label="지도 축소">−</button><button id="zoom-in" aria-label="지도 확대">+</button>
      <button id="reset-view" aria-label="지도 원래 위치"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7a7 7 0 1 1-1 6M4 3v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <noscript><p class="noscript">프로젝트 이름을 눌러 이동할 수 있습니다.</p></noscript>

  <script>
  (() => {
    'use strict';
    const $=id=>document.getElementById(id);
    const viewport=$('orbit-viewport'),map=$('star-map');
    let scale=1,panX=0,panY=0,dragging=false,suppressClick=false,dragStart=null;
    function renderMap(){map.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;$('zoom-in').disabled=scale>=1.7;$('zoom-out').disabled=scale<=.7;}
    function setZoom(value){scale=Math.min(1.7,Math.max(.7,value));renderMap();}
    function resetMap(){scale=1;panX=0;panY=0;renderMap();}
    $('zoom-in').addEventListener('click',()=>setZoom(scale+.15));
    $('zoom-out').addEventListener('click',()=>setZoom(scale-.15));
    $('reset-view').addEventListener('click',resetMap);
    viewport.addEventListener('pointerdown',event=>{
      if(event.button!==0||!event.isPrimary)return;
      dragStart={x:event.clientX,y:event.clientY,panX,panY,pointerId:event.pointerId};
    });
    viewport.addEventListener('pointermove',event=>{
      if(!dragStart||dragStart.pointerId!==event.pointerId)return;
      const dx=event.clientX-dragStart.x,dy=event.clientY-dragStart.y;
      if(!dragging&&Math.hypot(dx,dy)>6){dragging=true;suppressClick=true;viewport.classList.add('dragging');viewport.setPointerCapture(event.pointerId);}
      if(dragging){panX=Math.max(-viewport.clientWidth*.65,Math.min(viewport.clientWidth*.65,dragStart.panX+dx));panY=Math.max(-viewport.clientHeight*.5,Math.min(viewport.clientHeight*.5,dragStart.panY+dy));renderMap();}
    });
    function endPointer(event){if(dragStart?.pointerId===event.pointerId){dragStart=null;dragging=false;viewport.classList.remove('dragging');setTimeout(()=>{suppressClick=false;},0);}}
    window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',endPointer);viewport.addEventListener('lostpointercapture',endPointer);
    viewport.addEventListener('click',event=>{if(suppressClick){event.preventDefault();event.stopPropagation();}},true);
    viewport.addEventListener('wheel',event=>{if(!event.ctrlKey)return;event.preventDefault();setZoom(scale-event.deltaY*.002);},{passive:false});
    const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
    let motionPaused=reducedMotion.matches;
    function updateMotionButton(){const button=$('motion-toggle');button.setAttribute('aria-label',motionPaused?'별빛 움직임 켜기':'별빛 움직임 끄기');button.setAttribute('aria-pressed',String(motionPaused));button.classList.toggle('is-paused',motionPaused);}
    $('motion-toggle').addEventListener('click',()=>{motionPaused=!motionPaused;updateMotionButton();if(!motionPaused)startAnimation();else{cancelAnimationFrame(frame);frame=null;drawStars(lastTime);}});
    reducedMotion.addEventListener('change',event=>{motionPaused=event.matches;updateMotionButton();if(!motionPaused)startAnimation();else{cancelAnimationFrame(frame);frame=null;drawStars(lastTime);}});
    const canvas=$('starfield'),ctx=canvas.getContext('2d');
    let width=0,height=0,stars=[],frame=null,lastTime=0,lastDraw=0;
    function seedRandom(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};}
    function resize(){
      const rect=$('universe').getBoundingClientRect();width=rect.width;height=rect.height;
      const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx?.setTransform(dpr,0,0,dpr,0,0);
      const random=seedRandom(20261007);stars=Array.from({length:Math.min(520,Math.floor(width*height/2400))},()=>({x:random()*width,y:random()*height,r:random()*.95+.15,a:random()*.55+.15,phase:random()*Math.PI*2,speed:random()*.4+.2}));
      drawStars(lastTime);
    }
    function drawStars(time){
      if(!ctx)return;ctx.clearRect(0,0,width,height);
      stars.forEach(star=>{const flicker=motionPaused?1:.7+Math.sin(time*.0003*star.speed+star.phase)*.3;ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fillStyle=`rgba(204,211,242,${star.a*flicker})`;ctx.fill();});
      const fixedStars=[[.42,.2],[.69,.57],[.88,.37],[.34,.82],[.97,.17],[.65,.15],[.11,.86]];
      fixedStars.forEach(([x,y],i)=>{const px=x*width,py=y*height;const glow=ctx.createRadialGradient(px,py,0,px,py,i%2?9:6);glow.addColorStop(0,'#dfd9ff88');glow.addColorStop(.2,'#c0b0ff33');glow.addColorStop(1,'#aaaaff00');ctx.fillStyle=glow;ctx.fillRect(px-10,py-10,20,20);ctx.fillStyle='#ddd6ff99';ctx.fillRect(px-.5,py-3,1,6);ctx.fillRect(px-3,py-.5,6,1);});
    }
    function tick(time){frame=null;if(document.hidden||motionPaused)return;if(time-lastDraw>40){lastTime=time;lastDraw=time;drawStars(time);}frame=requestAnimationFrame(tick);}
    function startAnimation(){if(frame===null&&!document.hidden&&!motionPaused)frame=requestAnimationFrame(tick);}
    document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=null;}else startAnimation();});
    const observer=new ResizeObserver(resize);observer.observe($('universe'));
    window.addEventListener('resize',()=>{if(scale!==1||panX||panY)resetMap();});
    updateMotionButton();resize();startAnimation();
  })();
  </script>
